<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who's That UCSB Baby?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Allura&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ucsb-navy: #003660;
    --ucsb-gold: #FEBC11;
    --cream: #FBF5EA;
    --cream-2: #F4ECD8;
    --ink: #1A2A3A;
    --ink-soft: #4A5A6A;
    --pink: #F8DCDC;
    --pink-deep: #E89B9B;
    --green: #2F8F4F;
    --red: #C44545;
    --card-bg: #FFFFFF;
    --shadow-sm: 0 2px 6px rgba(0, 54, 96, 0.08);
    --shadow-md: 0 8px 24px rgba(0, 54, 96, 0.12);
    --shadow-lg: 0 18px 40px rgba(0, 54, 96, 0.18);
    --sans: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 1200px 600px at 10% -10%, rgba(254, 188, 17, 0.10), transparent 60%),
      radial-gradient(ellipse 1000px 500px at 90% 10%, rgba(248, 220, 220, 0.55), transparent 60%),
      radial-gradient(ellipse 800px 600px at 50% 110%, rgba(0, 54, 96, 0.06), transparent 60%),
      var(--cream);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
    padding: 32px 18px 80px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(circle at 2px 2px, rgba(0, 54, 96, 0.06) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.5;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .hdr {
    text-align: center;
    margin: 8px auto 32px;
    padding: 8px 0;
  }
  .hdr__title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(42px, 9vw, 96px);
    color: var(--ink);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .hdr__title .who { display: block; }
  .hdr__sub {
    display: inline-flex;
    align-items: center;
    gap: 0.18em;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hdr__ucsb {
    display: inline-block;
    width: clamp(120px, 22vw, 200px);
    height: auto;
  }
  .hdr__baby {
    font-family: 'Allura', cursive;
    font-size: clamp(56px, 12vw, 120px);
    color: var(--pink-deep);
    line-height: 0.6;
    transform: rotate(-3deg);
    text-shadow: 1px 2px 0 rgba(0,0,0,0.04);
  }

  .name-card {
    background: var(--card-bg);
    border: 1px solid rgba(0, 54, 96, 0.10);
    border-radius: 14px;
    padding: 18px 20px;
    margin: 0 auto 28px;
    max-width: 520px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .name-card__label {
    font-family: var(--sans);
    font-weight: 700;
    color: var(--ucsb-navy);
    font-size: 16px;
    flex-shrink: 0;
  }
  .name-card__input {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 2px solid var(--ucsb-navy);
    background: transparent;
    padding: 8px 4px;
    font-family: var(--sans);
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .name-card__input:focus { border-color: var(--ucsb-gold); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  }
  @media (max-width: 680px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(0, 54, 96, 0.08);
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .card.is-answered {
    border-color: var(--ucsb-gold);
    box-shadow: 0 0 0 2px var(--ucsb-gold), var(--shadow-sm);
  }
  .card__photo-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--cream-2);
  }
  .card__photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .card__num {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 38px;
    height: 38px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    z-index: 2;
    overflow: visible;
  }

  .select-wrap {
    position: relative;
    margin: 12px;
  }
  .card__select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    width: 100%;
    padding: 12px 38px 12px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--cream);
    border: 2px solid rgba(0, 54, 96, 0.18);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.2;
  }
  .card__select:hover { border-color: var(--ucsb-navy); }
  .card__select:focus {
    outline: none;
    border-color: var(--ucsb-gold);
    box-shadow: 0 0 0 3px rgba(254, 188, 17, 0.25);
  }
  .card__select.has-value {
    background: white;
    border-color: var(--ucsb-navy);
    color: var(--ucsb-navy);
    font-weight: 700;
  }
  .select-arrow {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 9px;
    color: var(--ucsb-navy);
    pointer-events: none;
  }

  .actions {
    margin: 36px auto 0;
    text-align: center;
  }
  .btn {
    display: inline-block;
    background: var(--ucsb-navy);
    color: var(--ucsb-gold);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 18px;
    padding: 14px 36px;
    border: 3px solid var(--ucsb-gold);
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 6px 0 rgba(0, 54, 96, 0.25);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    text-decoration: none;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 rgba(0, 54, 96, 0.25);
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0, 54, 96, 0.25);
  }
  .btn:disabled, .btn.is-disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: 0 6px 0 rgba(0, 54, 96, 0.25);
  }

  .answers {
    margin: 40px auto 0;
    max-width: 720px;
    background: white;
    border-radius: 18px;
    padding: 32px 32px 28px;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(0, 54, 96, 0.10);
    display: none;
    font-family: var(--sans);
  }
  .answers.is-open {
    display: block;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .answers__title {
    font-family: var(--sans);
    font-weight: 900;
    font-size: 34px;
    color: var(--ucsb-navy);
    margin: 0 0 6px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .answers__score {
    text-align: center;
    margin: 6px 0 24px;
    font-family: var(--sans);
    color: var(--ink-soft);
    font-size: 19px;
  }
  .answers__score strong {
    font-weight: 900;
    font-size: 30px;
    color: var(--ucsb-navy);
  }
  .answers__list {
    list-style: none;
    padding: 0;
    margin: 0 0 28px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 36px;
  }
  @media (max-width: 520px) {
    .answers__list { grid-template-columns: 1fr; gap: 0; }
  }
  .answers__item {
    display: grid;
    grid-template-columns: 38px 1fr;
    column-gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0, 54, 96, 0.10);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.3;
  }
  .answers__num {
    font-family: var(--sans);
    font-weight: 900;
    color: var(--ucsb-navy);
    font-size: 18px;
    padding-top: 1px;
  }
  .answers__body { min-width: 0; }
  .answers__guess { color: var(--ink); font-weight: 600; }
  .answers__guess.empty { color: var(--pink-deep); font-style: italic; font-weight: 600; }
  .answers__correct {
    display: block;
    font-size: 17px;
    color: var(--green);
    margin-top: 4px;
    font-weight: 400;
  }
  .answers__mark {
    width: 22px;
    height: 22px;
    margin-left: 8px;
    vertical-align: -5px;
    stroke-width: 3.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .answers__mark.right { stroke: var(--green); }
  .answers__mark.wrong { stroke: var(--red); }
  .answers__btnrow {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .answers__hint {
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 14px;
    margin: 16px 0 0;
  }
  .answers__hint.is-error { color: var(--red); }
  .answers__hint.is-success { color: var(--green); font-weight: 700; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ucsb-navy);
    color: var(--ucsb-gold);
    padding: 12px 22px;
    border-radius: 999px;
    font-family: var(--sans);
    font-weight: 700;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 100;
  }
  .toast.is-shown {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media print {
    body::before { display: none; }
    .actions, .answers, .name-card { display: none !important; }
    .card { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>

      const xSvg = '<svg class="answers__mark wrong" viewBox="0 0 24 24" aria-label="Wrong"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

      selects.forEach(s => {
        const num = parseInt(s.dataset.num, 10);
        const val = s.value;
        const correct = ANSWERS[num];
        const isRight = val === correct;
        if (isRight) correctCount++;
        guesses.push({ num, val, correct, isRight });

        const li = document.createElement('li');
        li.className = 'answers__item';

        const mark = (val && isRight) ? checkSvg : xSvg;
        const showCorrect = !isRight;
        const guessSpan = val
          ? '<span class="answers__guess">' + escapeHtml(val) + '</span>'
          : '<span class="answers__guess empty">No Guess</span>';
        const correctLine = showCorrect
          ? '<span class="answers__correct">Correct: ' + escapeHtml(correct) + '</span>'
          : '';

        li.innerHTML =
          '<span class="answers__num">' + num + ')</span>' +
          '<div class="answers__body">' + guessSpan + mark + correctLine + '</div>';
        answersList.appendChild(li);
      });

      answersScore.innerHTML = 'Score: <strong>' + correctCount + ' / 13</strong>';
      currentResults = { guesses, score: correctCount };
    }

    function buildAnswersText(name, guesses, score) {
      const lines = [];
      lines.push("Hi " + RECIPIENT_NAME + ",");
      lines.push("");
      lines.push("Here are " + (name || "a guest") + "'s guesses for Who's That UCSB Baby:");
      lines.push("");
      guesses.forEach(g => {
        const guess = g.val || "No Guess";
        const mark = g.isRight ? "CORRECT" : "WRONG";
        let line = g.num + ") " + guess + "  [" + mark + "]";
        if (!g.isRight) line += "  (correct answer: " + g.correct + ")";
        lines.push(line);
      });
      lines.push("");
      lines.push("Final score: " + score + " / 13");
      return lines.join("\n");
    }

    showBtn.addEventListener('click', () => {
      buildResults();
      submitHint.textContent = '';
      submitHint.className = 'answers__hint';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Results';
      answersPanel.classList.add('is-open');
      setTimeout(() => answersPanel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('is-shown');
      setTimeout(() => toast.classList.remove('is-shown'), 2200);
    }

    submitBtn.addEventListener('click', async () => {
      if (!currentResults) return;

      // Friendly check that Casey replaced the placeholder
      if (WEB3FORMS_KEY === '47b06068-92c0-499d-b7e7-1bb266f4a37c' || !WEB3FORMS_KEY) {
        submitHint.textContent = "Submission isn't set up yet — the host needs to add the email key to this file.";
        submitHint.className = 'answers__hint is-error';
        return;
      }

      const name = playerName.value.trim();
      const { guesses, score } = currentResults;
      const bodyText = buildAnswersText(name, guesses, score);
      const subject = "Who's That UCSB Baby — " + (name || "Guest") + " (" + score + "/13)";

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      submitHint.textContent = '';
      submitHint.className = 'answers__hint';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: subject,
            from_name: name || 'Baby Shower Guest',
            guest_name: name || 'Anonymous',
            score: score + ' / 13',
            message: bodyText
          })
        });
        const data = await res.json();
        if (data.success) {
          submitBtn.textContent = '✓ Submitted';
          submitBtn.classList.add('is-disabled');
          submitHint.textContent = "Thanks! Your guesses are on their way to " + RECIPIENT_NAME + ".";
          submitHint.className = 'answers__hint is-success';
          showToast('Submitted!');
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Try again';
        submitHint.textContent = "Sorry, something went wrong. Please try again, or text your results to " + RECIPIENT_NAME + ".";
        submitHint.className = 'answers__hint is-error';
      }
    });

    playerName.addEventListener('input', () => {
      if (answersPanel.classList.contains('is-open')) buildResults();
    });

    updateProgress();
  })();
</script>
</body>
</html>
